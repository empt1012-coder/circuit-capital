<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Circuit &amp; Capital</title>
  <meta name="description" content="Contact the Circuit & Capital desk.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-base="." data-page="contact">
  <div id="site-header"></div>
  <main id="main" class="wrap legal">
    <header class="page-head">
      <div class="kicker">Desk</div>
      <h1>Contact</h1>
      <p class="dek">Tips, corrections, advertising, and privacy requests.</p>
    </header>
    <p>Set real inboxes in <code>js/config.js</code>. Until the site is on Netlify, Send opens your email app.</p>
    <p>Editorial: <a href="mailto:editor@example.com">editor@example.com</a><br>
    Advertising: <a href="mailto:ads@example.com">ads@example.com</a></p>
    <form class="form" name="contact" method="POST" action="/thanks.html" data-contact data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p class="visually-hidden"><label>Don’t fill this out <input name="bot-field"></label></p>
      <label for="name">Name</label>
      <input id="name" name="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option>Editorial / tip</option>
        <option>Advertising</option>
        <option>Correction</option>
        <option>Privacy</option>
      </select>
      <label for="msg">Message</label>
      <textarea id="msg" name="message" required></textarea>
      <p><button class="btn btn--ink" type="submit">Send</button></p>
    </form>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/ads.js"></script>
</body>
</html>
